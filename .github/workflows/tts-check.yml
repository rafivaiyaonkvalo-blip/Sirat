name: TTS voice check

# api/tts.js বদলালে Microsoft কণ্ঠ পরীক্ষা (শুধু claude/ শাখায়; deploy করে না)
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'api/tts.js'
      - 'scripts/tts-check.mjs'
      - '.github/workflows/tts-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Check voices
        run: node scripts/tts-check.mjs

      - name: Upload audio samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-check-audio
          path: tts-check-out
