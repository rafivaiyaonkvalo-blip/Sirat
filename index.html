    <script>
      (function() {
        try {
          var saved = localStorage.getItem('uls_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = (saved === 'dark' || saved === 'light') ? (saved === 'dark') : prefersDark;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#0A0D12';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#FFFFFF';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

        color-scheme: light dark;

      /* Native App Ergonomics: Eliminate browser artifacts */
      * {
        -webkit-tap-highlight-color: transparent !important;
        -webkit-touch-callout: none;
      }
      /* Prevent accidental text selection on UI chrome and buttons */
      button, a, nav, header, [role="button"], .select-none {
        user-select: none;
        -webkit-user-select: none;
      }
      /* Native look: Hide scrollbars across the entire app */
      ::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #0A0D12;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        overscroll-behavior-y: none;
      }
      @media (prefers-color-scheme: light) {
        html:not(.dark), html:not(.dark) body {
          background-color: #FFFFFF !important;
        }
      }
      html.dark, html.dark body {
        background-color: #0A0D12 !important;
      }

    <script>
      // Automatically refresh when a new build deployment updates asset chunk hashes
      window.addEventListener('vite:preloadError', () => {
        window.location.reload();
      });
      window.addEventListener('error', (e) => {
        const msg = e?.message || '';
        if (msg.includes('Loading chunk') || msg.includes('dynamically imported module') || msg.includes('Failed to fetch')) {
          const now = Date.now();
          const last = parseInt(sessionStorage.getItem('uls_chunk_retry') || '0', 10);
          if (now - last > 8000) {
            sessionStorage.setItem('uls_chunk_retry', now.toString());
            window.location.reload();
          }
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              for (const reg of regs) reg.unregister();
            });
            if ('caches' in window) {
              caches.keys().then((keys) => {
                for (const key of keys) caches.delete(key);
              });
            }
            return;
          }
          const swUrl = window.location.pathname.startsWith('/sirat') ? '/sirat/sw.js' : '/sw.js';
          const swScope = window.location.pathname.startsWith('/sirat') ? '/sirat/' : '/';
          navigator.serviceWorker.register(swUrl, { scope: swScope }).then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
