<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>সীরাত – মারকাযুল ঈমান</title>
    <meta name="description" content="নবীজী ﷺ-এর জীবনী নিয়ে ধারাবাহিক দারস: ভিডিও, পাঠ ও কুইজ। মারকাযুল ঈমান মাদরাসা।" />
    <link rel="icon" type="image/svg+xml" href="/sirat-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b3b37" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('sirat_theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // পুরনো আরবি-পোর্টালের service worker থাকলে মুছে ফেলা
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
        if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
      }
    </script>
  </body>
</html>
